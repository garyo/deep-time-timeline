name = "timeline-events-api"
compatibility_date = "2025-05-27"

[assets]
directory = "./dist/"
# This site is one page, but "single-page-application" answers 200 with that
# page for EVERY unknown URL — so mistyped and probed addresses looked like real
# pages, to visitors and to analytics alike. "404-page" serves dist/404.html
# with a real 404 status instead (src/pages/404.astro builds it).
not_found_handling = "404-page"

[observability.logs]
enabled = true
